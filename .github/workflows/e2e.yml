name: E2E

# Informational browser tests, separate from the fast Frontend CI. This workflow is not a required
# status check, so a paths filter is safe here: a skipped run cannot block a merge. If it becomes
# required, replace the filter with the change-detection and gate jobs used in frontend-ci.yml.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Chromium)
    # Ubuntu only to keep time and cost down; local runs cover Windows and macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The E2E TypeScript project is separate from the production build, so it is checked here.
      - name: Typecheck E2E tests
        run: npm run typecheck:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright config builds the app and serves it with vite preview before the tests.
      - name: Run Playwright tests
        run: npm run test:e2e

      # Contains the HTML report with embedded traces from retried tests; open it with
      # `npx playwright show-report <unzipped folder>`.
      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

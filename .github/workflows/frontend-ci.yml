name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # frontend/.nvmrc is the single source of truth for the Node version. "24" resolves to the
      # latest 24.x (current LTS), so patch releases are picked up automatically; a major upgrade
      # is a deliberate one-line change in .nvmrc. Action inputs resolve from the repository root,
      # not the run working directory.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Run the remaining checks after an ESLint failure so one run reports every failure.
      - name: Prettier format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx prettier --check .

      - name: Vitest unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run

      - name: Typecheck and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
